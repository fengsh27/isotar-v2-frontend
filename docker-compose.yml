# Developer compose file: runs the published backend image with a frontend
# built from this checkout. End users should take docker-compose.yml from the
# isoTar-v2 repository instead, which pulls both images (see INSTALL.md there
# or the "Run isoTar locally" page in the docs).
#
#   cp .env.template .env      # optional credentials and host settings
#   docker compose up -d --build

services:
  backend:
    image: frankfeng78/isotar-v2:0.3.35
    container_name: isotar-v2-backend
    # nginx (8080) inside the container fronts the API and routes
    # /api/v1/* to the Flask app. The log directories are created in case an
    # older image lacks them; supervisord refuses to start without them.
    command: sh -c "mkdir -p /app/logs/gunicorn /app/logs/celery && exec /usr/bin/supervisord"
    # Not published on the host: the frontend reaches it as http://backend:8080.
    expose:
      - "8080"
    # Concurrency knobs, consumed by app_v1/limits.py inside the image:
    #   ISOTAR_MAX_CORES_PER_JOB    -- API rejects cores > this (HTTP 400).
    #   ISOTAR_DEFAULT_CORES        -- used when a submission omits "cores".
    #   ISOTAR_MAX_CONCURRENT_JOBS  -- celery --concurrency for app_v1_worker.
    # Keep jobs x cores <= the cpus limit under deploy.resources below.
    environment:
      - ISOTAR_MAX_CORES_PER_JOB=${ISOTAR_MAX_CORES_PER_JOB:-8}
      - ISOTAR_DEFAULT_CORES=${ISOTAR_DEFAULT_CORES:-8}
      - ISOTAR_MAX_CONCURRENT_JOBS=${ISOTAR_MAX_CONCURRENT_JOBS:-4}
    # Secrets for the literature verification feature come from `.env` next to
    # this file (git-ignored; start from `.env.template`): NCBI_API_KEY and
    # NCBI_EMAIL for PubMed, ANTHROPIC_BASE_URL / ANTHROPIC_AUTH_TOKEN /
    # ISOTAR_VERIFICATION_MODEL for the model review. Without the file the
    # stack runs and the job page hides or disables those options. Keys under
    # `environment:` above take precedence over the same keys in `.env`.
    env_file:
      - path: .env
        required: false
    volumes:
      # Jobs, logs and the verification caches. Set ISOTAR_DATA_DIR in `.env`
      # to put it somewhere else.
      - ${ISOTAR_DATA_DIR:-./isotar-data}:/opt/out
    deploy:
      resources:
        limits:
          # Hard ceiling for all jobs combined, whatever the settings above.
          cpus: "${ISOTAR_CPU_LIMIT:-32}"
    restart: unless-stopped

  frontend:
    build:
      context: .
      args:
        # Baked into routes-manifest.json at build time; must match the
        # docker-network address of the backend service.
        API_BASE: http://backend:8080
    image: frankfeng78/isotar-v2-frontend:0.2.13
    container_name: isotar-v2-frontend
    ports:
      - "${ISOTAR_PORT:-9501}:3000"
    environment:
      - API_BASE=http://backend:8080
    depends_on:
      - backend
    restart: unless-stopped
